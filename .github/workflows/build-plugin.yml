name: Build luci-app-rootfs-resize (.apk)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'luci-app-rootfs-resize/**'
      - '.github/workflows/build-plugin.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 用 po2lmo 把 po/ 源码编译成 .lmo（宿主持编译，纯 C 标准依赖）
      # 官方构建链：lemon(parser generator) -> plural_formula.c/h -> po2lmo
      - name: Compile .lmo translations from po sources
        run: |
          mkdir -p /tmp/po2lmo-build/lib /tmp/po2lmo-build/contrib \
            luci-app-rootfs-resize/root/usr/lib/lua/luci/i18n
          cd /tmp/po2lmo-build
          curl -sf -O https://raw.githubusercontent.com/openwrt/luci/master/modules/luci-base/src/po2lmo.c
          curl -sf -o lib/lmo.c  https://raw.githubusercontent.com/openwrt/luci/master/modules/luci-base/src/lib/lmo.c
          curl -sf -o lib/lmo.h  https://raw.githubusercontent.com/openwrt/luci/master/modules/luci-base/src/lib/lmo.h
          curl -sf -o lib/plural_formula.y https://raw.githubusercontent.com/openwrt/luci/master/modules/luci-base/src/lib/plural_formula.y
          curl -sf -o contrib/lemon.c   https://raw.githubusercontent.com/openwrt/luci/master/modules/luci-base/src/contrib/lemon.c
          curl -sf -o contrib/lempar.c  https://raw.githubusercontent.com/openwrt/luci/master/modules/luci-base/src/contrib/lempar.c
          # lempar.c 是 lemon 的模板（运行时可被读取），不参与编译
          cc -std=gnu17 -w -o contrib/lemon contrib/lemon.c
          ./contrib/lemon -q lib/plural_formula.y
          gcc -w -O2 -o po2lmo po2lmo.c lib/lmo.c lib/plural_formula.c
          for po in "$GITHUB_WORKSPACE"/luci-app-rootfs-resize/po/*/*.po; do
            lang="$(basename "$(dirname "$po")")"
            ./po2lmo "$po" "$GITHUB_WORKSPACE/luci-app-rootfs-resize/root/usr/lib/lua/luci/i18n/rootfs-resize.${lang}.lmo"
          done
          ls -lh "$GITHUB_WORKSPACE/luci-app-rootfs-resize/root/usr/lib/lua/luci/i18n/"

      # 官方 OpenWrt 25.12.5 x86_64 SDK 容器（SDK 已预装，CONFIG_USE_APK=y 直接出 .apk）
      # 纯 Makefile 写法，无需 feeds update
      - name: Build .apk in official SDK container
        run: |
          mkdir -p out && chmod 777 out   # 容器内 -u buildbot 需要写权限
          docker run --rm -u buildbot -v "$PWD":/src -w /builder \
            ghcr.io/openwrt/sdk:x86_64-25.12.5 \
            /bin/bash -e -c '
              cp -r /src/luci-app-rootfs-resize package/luci-app-rootfs-resize
              make defconfig > /dev/null
              make package/luci-app-rootfs-resize/compile V=s 2>&1 | tail -25
              # 产物在 bin/packages/x86_64/<SECTION>/ 下（此处为 base/），用 find 兜底
              APK=$(find /builder/bin -name "luci-app-rootfs-resize*.apk" | head -1)
              [ -n "$APK" ] || { echo "NO APK FOUND"; find /builder/bin -maxdepth 4 -type d | head; exit 1; }
              cp "$APK" /src/out/
            '
          ls -lh out/

      - name: Upload .apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-rootfs-resize-apk
          path: out/*.apk
          if-no-files-found: error
