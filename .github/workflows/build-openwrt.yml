name: Build OpenWrt x86_64 combined-efi

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenWrt release version (e.g. 25.12.5)'
        required: false
        default: '25.12.5'
  push:
    branches: [master]
    paths:
      - 'files/**'
      - '.github/workflows/build-openwrt.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || '25.12.5' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libncurses5-dev zstd file gawk gettext wget unzip python3

      - name: Download & extract official Image Builder
        run: |
          IB="openwrt-imagebuilder-${VERSION}-x86-64.Linux-x86_64"
          curl -fLO "https://downloads.openwrt.org/releases/${VERSION}/targets/x86/64/${IB}.tar.zst"
          tar --zstd -xf "${IB}.tar.zst"
          mv "${IB}" imagebuilder

      # 第三方包（不在官方 feed 里）: 官方 Image Builder 支持把 .apk 放进 packages/ 目录，
      # 构建时自动 apk mkndx 生成本地索引（见 openwrt README.apk.md）。
      # OpenClash / argon / shadcn 的 release 均提供 noarch 的 .apk 资产，取最新即可。
      # shadcn（eamonxg/luci-theme-shadcn）：release 的 .apk 即 25.12 的 ADBd v3 格式，
      # 与作者 feed openwrt.eamonxg.fun 同源；同 release 附带的 .ipk 是 opkg 用的，勿取。
      - name: Download third-party packages (OpenClash / Argon / Shadcn)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p imagebuilder/packages
          gh release download --repo vernesong/OpenClash --pattern '*.apk' --dir imagebuilder/packages
          gh release download --repo jerrykuku/luci-theme-argon \
            --pattern 'luci-theme-argon-*.apk' \
            --pattern 'luci-app-argon-config-*.apk' \
            --pattern 'luci-i18n-argon-config-*.apk' \
            --dir imagebuilder/packages
          gh release download --repo eamonxg/luci-theme-shadcn \
            --pattern 'luci-theme-shadcn-*.apk' \
            --dir imagebuilder/packages
          # argon 上游 i18n 的 apk 文件名里版本号用 '.'，而包内索引是 '~'，
          # apk 按索引推导要抓取的文件名，导致 "package mentioned in index not found"。
          # 仅在“最后一段是 7 位 hex 短哈希”时把最后一个 '.' 改为 '~'（上游修复后自动跳过）。
          for f in imagebuilder/packages/luci-i18n-argon-config-zh-cn-*.apk; do
            [ -e "$f" ] || continue
            case "$(basename "$f" .apk)" in
              *~*) continue ;;
              *.[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f])
                b="$(basename "$f" .apk)"
                mv "$f" "$(dirname "$f")/${b%.*}~${b##*.}.apk" ;;
            esac
          done
          ls -lh imagebuilder/packages/

      # 预置 mihomo (meta) 核心，OpenClash 开箱即用。
      # - compatible 版对 PVE 虚拟机（老指令集 CPU）兼容性最好
      # - OpenClash 期望的核心路径: /etc/openclash/core/clash_meta（官方 release notes 指定）
      # - 通过 FILES 机制写入（imagebuilder 的 file_copy 用 cp -fpR，保留可执行权限）
      - name: Embed mihomo (meta) core into image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p files/etc/openclash/core
          gh release download --repo MetaCubeX/mihomo \
            --pattern 'mihomo-linux-amd64-compatible-*.gz' \
            --dir /tmp/mihomo --clobber
          gz="$(ls /tmp/mihomo/mihomo-linux-amd64-compatible-*.gz | head -1)"
          gunzip -c "$gz" > files/etc/openclash/core/clash_meta
          chmod +x files/etc/openclash/core/clash_meta
          files/etc/openclash/core/clash_meta -v
          echo "mihomo core: $(basename "$gz" .gz)"

      # 预置 geo 数据库 + 大陆白名单，开箱即有最新数据，无需首启下载。
      # 与 OpenClash openclash_geo.sh / openclash_chnroute.sh 同源同路径：
      #   GeoIP.dat   ← Loyalsoldier/v2ray-rules-dat geoip.dat
      #   GeoSite.dat ← Loyalsoldier/v2ray-rules-dat geosite.dat
      #   ASN.mmdb    ← xishang0128/geoip GeoLite2-ASN.mmdb
      #   Country.mmdb← alecthw/mmdb_china_ip_list lite 版（含大陆 IP）
      #   china_ip_route.ipset ← ispip.clang.cn/all_cn.txt 转 fw4 define 格式
      - name: Embed geo databases and chnroute into image
        run: |
          mkdir -p files/etc/openclash
          curl -fSL -o files/etc/openclash/GeoIP.dat \
            https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          curl -fSL -o files/etc/openclash/GeoSite.dat \
            https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
          curl -fSL -o files/etc/openclash/ASN.mmdb \
            https://github.com/xishang0128/geoip/releases/latest/download/GeoLite2-ASN.mmdb
          curl -fSL -o files/etc/openclash/Country.mmdb \
            https://raw.githubusercontent.com/alecthw/mmdb_china_ip_list/release/lite/Country.mmdb
          curl -fSL -o /tmp/all_cn.txt https://ispip.clang.cn/all_cn.txt
          {
            printf 'define china_ip_route = {\n'
            awk '!/^$/&&!/^#/{printf "    %s,\n", $0}' /tmp/all_cn.txt
            printf '}\n'
            printf 'add set inet fw4 china_ip_route { type ipv4_addr; flags interval; auto-merge; }\n'
            printf 'add element inet fw4 china_ip_route $china_ip_route\n'
          } > files/etc/openclash/china_ip_route.ipset
          ls -lh files/etc/openclash/

      # ddns-go 动态 DNS：sirpdboy/luci-app-ddns-go（LuCI 界面 + 二进制）。
      # 官方源没有 ddns-go；sirpdboy release 的 24.10-x86_64 编译包中
      # ddns-go 是 Go 静态二进制（x86_64），luci 部分是 noarch JS/ucode，
      # 与 25.12 luci 兼容（已在测试机 192.168.3.1 验证）。
      # 把 ipk 解包进 files/ 固化；配置/用户/自启用由 files/etc/uci-defaults/99-ddns-go 处理。
      - name: Embed ddns-go (binary + LuCI app) into image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/ddnsgo && mkdir -p /tmp/ddnsgo
          gh release download --repo sirpdboy/luci-app-ddns-go \
            --pattern 'openwrt-24.10-x86_64.tar.gz' --dir /tmp/ddnsgo
          tar -xzf /tmp/ddnsgo/openwrt-24.10-x86_64.tar.gz -C /tmp/ddnsgo
          mkdir -p /tmp/ddnsgo/root/{usr,etc,www,lib}
          for ipk in /tmp/ddnsgo/packages_ci/*.ipk; do
            d="/tmp/ddnsgo/$(basename "$ipk" .ipk)"
            mkdir -p "$d"
            tar -xzf "$ipk" -C "$d"
            tar -xzf "$d/data.tar.gz" -C "$d"
            for dir in usr etc www lib; do
              [ -d "$d/$dir" ] && cp -a "$d/$dir"/. /tmp/ddnsgo/root/$dir/
            done
          done
          # 上游 99-luci-ddns-go 的 rpcd 权限逻辑并入我们 git 管理的 99-ddns-go，删掉避免重复
          rm -f /tmp/ddnsgo/root/etc/uci-defaults/99-luci-ddns-go
          cp -a /tmp/ddnsgo/root/. files/
          chmod +x files/usr/bin/ddns-go files/usr/share/rpcd/ucode/luci.ddns-go files/etc/init.d/ddns-go
          ls -lh files/usr/bin/ddns-go

      # UU 加速器插件（网易官方闭源，v14.2.2+，含 WOL 远程唤醒协议）。
      # 官方只提供脚本安装（install.sh），无 apk/ipk；这里走“预烘焙”路线：
      #   - 从官方 API 实时拿最新版本 + md5，下载 uu.tar.gz（x86_64 ≈3MB）
      #   - uuplugin → files/usr/bin/uugamebooster（二进制内含 uu_router_messages.Wol/WolReply
      #     协议与 ff:ff:ff:ff:ff:ff 魔术包广播，支持 App 下发远程唤醒指令）
      #   - xtables-nft-multi → files/usr/bin/（iptables-nft 兼容层，fw4/nftables 环境用）
      #   - LuCI 界面取自 fengqi/luci-app-uugamebooster（Tianling Shen，ImmortalWrt 官方成员，
      #     master 分支适配 OpenWrt 25.12+ 的纯 JS 前端）
      #   - 中文翻译用 po2lmo 编译成 .lmo（luci 运行时只读 lmo）；po2lmo 由 luci-base 源码
      #     现场编译（lemon 生成 parser，纯 C 无额外依赖）
      # 首次使用：LuCI 服务→UU游戏加速器 开启，手机 App「UU主机加速」扫码绑定（sn=br-lan MAC）。
      # 与 OpenClash 共存：默认 Dnsmasq-hijack 模式已验证可共存；勿同时开 TUN 模式。
      - name: Embed UU GameBooster (binary + LuCI app) into image
        run: |
          set -euo pipefail
          # 1) 官方 API 获取最新版本下载地址 + md5（url 是 http://，换 https 更稳）
          PLUGIN_JSON="$(curl -fsSL 'https://router.uu.163.com/api/plugin?type=openwrt-x86_64')"
          PLUGIN_URL="$(printf '%s' "$PLUGIN_JSON" | python3 -c 'import json,sys;print(json.load(sys.stdin)["url"])' | sed 's|^http://|https://|')"
          PLUGIN_MD5="$(printf '%s' "$PLUGIN_JSON" | python3 -c 'import json,sys;print(json.load(sys.stdin)["md5"])')"
          echo "UU plugin: $PLUGIN_URL"
          # 2) 下载 + md5 校验 + 解压
          curl -fSL -o /tmp/uu.tar.gz "$PLUGIN_URL"
          echo "$PLUGIN_MD5  /tmp/uu.tar.gz" | md5sum -c -
          rm -rf /tmp/uu && mkdir -p /tmp/uu
          tar -xzf /tmp/uu.tar.gz -C /tmp/uu
          # 3) 二进制烘焙进 files/（file_copy 用 cp -fpR，install 保留可执行权限）
          mkdir -p files/usr/bin files/usr/share/uugamebooster
          install -m 0755 /tmp/uu/uuplugin files/usr/bin/uugamebooster
          install -m 0755 /tmp/uu/xtables-nft-multi files/usr/bin/xtables-nft-multi
          install -m 0644 /tmp/uu/uu.conf files/usr/share/uugamebooster/uu.conf
          # 4) LuCI 前端（fengqi master = 25.12+）+ 二维码
          rm -rf /tmp/uu-luci && git clone -q --depth 1 https://github.com/fengqi/luci-app-uugamebooster /tmp/uu-luci
          mkdir -p files/usr/share/luci/menu.d files/usr/share/rpcd/acl.d \
                   files/usr/lib/luci/static/resources/view files/www/uugamebooster
          cp /tmp/uu-luci/luci-app-uugamebooster/root/usr/share/luci/menu.d/luci-app-uugamebooster.json \
             files/usr/share/luci/menu.d/
          cp /tmp/uu-luci/luci-app-uugamebooster/root/usr/share/rpcd/acl.d/luci-app-uugamebooster.json \
             files/usr/share/rpcd/acl.d/
          cp /tmp/uu-luci/luci-app-uugamebooster/htdocs/luci-static/resources/view/uugamebooster.js \
             files/usr/lib/luci/static/resources/view/
          cp /tmp/uu-luci/luci-app-uugamebooster/root/www/uugamebooster/*.png files/www/uugamebooster/
          # 5) 中文翻译：po → lmo（po2lmo 从 luci-base 源码现场编译）
          rm -rf /tmp/po2lmo-src && mkdir -p /tmp/po2lmo-src/contrib /tmp/po2lmo-src/src/lib
          curl -fsSL https://raw.githubusercontent.com/openwrt/luci/openwrt-25.12/modules/luci-base/src/contrib/lemon.c -o /tmp/po2lmo-src/contrib/lemon.c
          curl -fsSL https://raw.githubusercontent.com/openwrt/luci/openwrt-25.12/modules/luci-base/src/contrib/lempar.c -o /tmp/po2lmo-src/contrib/lempar.c
          for f in plural_formula.y lmo.c lmo.h; do
            curl -fsSL "https://raw.githubusercontent.com/openwrt/luci/openwrt-25.12/modules/luci-base/src/lib/$f" -o "/tmp/po2lmo-src/src/lib/$f"
          done
          curl -fsSL https://raw.githubusercontent.com/openwrt/luci/openwrt-25.12/modules/luci-base/src/po2lmo.c -o /tmp/po2lmo-src/src/po2lmo.c
          (cd /tmp/po2lmo-src \
            && cc -std=gnu17 -o contrib/lemon contrib/lemon.c \
            && (cd src && ../contrib/lemon -q lib/plural_formula.y) \
            && cc -o po2lmo src/po2lmo.c src/lib/lmo.c src/lib/plural_formula.c)
          mkdir -p files/usr/lib/luci/i18n
          /tmp/po2lmo-src/po2lmo /tmp/uu-luci/luci-app-uugamebooster/po/zh_Hans/uugamebooster.po \
            files/usr/lib/luci/i18n/uugamebooster.zh-cn.lmo
          ls -lh files/usr/bin/uugamebooster files/usr/lib/luci/i18n/uugamebooster.zh-cn.lmo

      # 预烘焙自研插件 luci-app-rootfs-resize（一键扩容 overlay）：
      # 与 UU 同路线——插件源码在仓库内，但 build-openwrt 不编译 SDK，这里直接把
      # 插件文件按 Makefile 的 install 段布局复制进 files/（等价于 apk 安装后的文件落点）：
      #   usr/libexec/rootfs-resize.sh ← INSTALL_BIN
      #   usr/share/rpcd/ucode|acl.d、usr/share/luci/menu.d、www/luci-static/...、etc/uci-defaults
      # 中文 lmo 复用上一步现场编译的 po2lmo（同一 runner，/tmp 跨步骤保留）。
      - name: Prebake luci-app-rootfs-resize into image
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/luci-app-rootfs-resize"
          mkdir -p files/usr/libexec files/usr/share/rpcd/ucode files/usr/share/rpcd/acl.d \
                   files/usr/share/luci/menu.d files/www/luci-static/resources/view/rootfsresize \
                   files/etc/uci-defaults files/usr/lib/lua/luci/i18n
          install -m 0755 "$SRC/root/usr/libexec/rootfs-resize.sh" files/usr/libexec/
          install -m 0644 "$SRC/root/usr/share/rpcd/ucode/rootfs-resize.uc" files/usr/share/rpcd/ucode/
          install -m 0644 "$SRC/root/usr/share/rpcd/acl.d/luci-app-rootfs-resize.json" files/usr/share/rpcd/acl.d/
          install -m 0644 "$SRC/root/usr/share/luci/menu.d/luci-app-rootfs-resize.json" files/usr/share/luci/menu.d/
          install -m 0644 "$SRC/htdocs/luci-static/resources/view/rootfsresize/overview.js" \
            files/www/luci-static/resources/view/rootfsresize/
          install -m 0644 "$SRC/root/etc/uci-defaults/50-rootfs-resize" files/etc/uci-defaults/
          /tmp/po2lmo-src/po2lmo "$SRC/po/zh-cn/luci-app-rootfs-resize.po" \
            files/usr/lib/lua/luci/i18n/rootfs-resize.zh-cn.lmo
          find files -path "*rootfs-resize*" -o -name "rootfs-resize*" | sort

      # 预置最新版 OpenClash Web 控制面板（metacubexd / zashboard）。
      # OpenClash .apk 内置的 ui 目录是 release 打包时固化的，滞后于上游；这里构建时直接从
      # 上游 gh-pages 分支拉取最新（与 OpenClash openclash_download_dashboard.sh 同源同路径）：
      #   metacubexd ← MetaCubeX/metacubexd 的 gh-pages
      #   zashboard  ← Zephyruso/zashboard 的 gh-pages-cdn-fonts
      # 经 FILES 覆盖镜像内 /usr/share/openclash/ui/<name>/（apk 旧 hashed 资产残留，仅占少量空间）；
      # 默认面板由 files/etc/uci-defaults/91-openclash-default-dashboard 首次开机设为 zashboard。
      - name: Embed latest dashboards (metacubexd / zashboard)
        run: |
          rm -rf files/usr/share/openclash/ui
          for spec in \
            "metacubexd|https://codeload.github.com/MetaCubeX/metacubexd/zip/refs/heads/gh-pages|metacubexd-gh-pages" \
            "zashboard|https://codeload.github.com/Zephyruso/zashboard/zip/refs/heads/gh-pages-cdn-fonts|zashboard-gh-pages-cdn-fonts"; do
            name="${spec%%|*}"; rest="${spec#*|}"; url="${rest%%|*}"; inner="${rest#*|}"
            curl -fSL -o "/tmp/${name}.zip" "$url"
            rm -rf "/tmp/${name}-x" && mkdir -p "/tmp/${name}-x" "files/usr/share/openclash/ui/${name}"
            unzip -q "/tmp/${name}.zip" -d "/tmp/${name}-x"
            cp -a "/tmp/${name}-x/${inner}/." "files/usr/share/openclash/ui/${name}/"
          done
          ls -lh files/usr/share/openclash/ui/*/index.html

      # 默认 profile=generic 即产出 squashfs-combined-efi.img.gz（官方默认 CONFIG_GRUB_EFI_IMAGES=y）。
      # ROOTFS_PARTSIZE：**保持官方默认 104MB，不要调大**！fstools 的 use_f2fs() 判定
      # 剩余容量 > F2FS_MINSIZE(100MiB) 就用 f2fs 格式化 overlay，否则 ext4。
      # 官方默认 104MB → 剩余 ~98MiB < 100MiB → ext4（可在线扩容，插件可用）；
      # 曾调 512MB → 剩余 ~458MiB > 100MiB → f2fs（无法在线扩容，实测踩坑）。
      # overlay 空间不够时用 luci-app-rootfs-resize 一键扩到整盘（ext4 在线扩容）。
      # PACKAGES：把初始化文档里的运行时 apk add 提前固化进镜像
      #   - luci-i18n-base-zh-cn  中文界面
      #   - block-mount          挂载点/overlay 工具
      #   - openssh-sftp-server  SFTP 服务
      #   - losetup / resize2fs  扩容 overlay 所需（losetup -c / resize2fs）
      #   - parted               扩分区（为未来的 luci 一键扩容插件准备）
      #   - btop                 系统监控
      # 第三方：
      #   - luci-app-openclash   代理插件（mihomo 核心已内置，见下）
      #   - luci-theme-argon     主题（自带 uci-defaults 自动设为默认主题）
      #   - luci-app-argon-config + 中文语言包
      #   - luci-theme-shadcn    shadcn/ui 风格主题（noarch，仅依赖 luci-base；默认主题仍由
      #                          99-luci-theme-default 保持 bootstrap，argon/shadcn 可随时切换）
      # 官方 luci feed 补充（对齐测试机功能面）：
      #   - luci-app-filemanager / luci-app-ttyd + 中文语言包
      # 评估通过的网络/系统增强（官方 feed，含中文语言包）：
      #   - luci-app-upnp        UPnP 端口映射
      #   - luci-app-wol         Wake-on-LAN 远程开机（etherwake 后端，已在测试机验证）
      #   - luci-app-watchcat    断线/定时自动重启
      #   - luci-app-sqm         智能 QoS（依赖 kmod-sched-cake 自动解析）
      #   - luci-app-nlbwmon     流量统计
      #   - luci-app-vnstat2     长期流量统计
      #   - luci-proto-wireguard WireGuard 接口（25.12 无独立 app，需 tools+kmod 配套）
      # 注：nano 官方源有；zip（创建 zip 的工具）不在官方 feed，需 bsdtar 替代或自编译
      # OpenClash 运行时依赖显式补齐（apk 元数据未含全部运行时依赖）：
      #   dnsmasq-full / luci-compat / bash / curl / ca-bundle / ip-full /
      #   ruby / ruby-yaml / kmod-tun / kmod-inet-diag / kmod-nft-tproxy / unzip
      # FILES：把初始化文档里的配置改动固化（network / system / profile.d）
      - name: Build image
        run: |
          make image PROFILE=generic \
            PACKAGES="luci luci-i18n-base-zh-cn luci-i18n-package-manager-zh-cn luci-i18n-firewall-zh-cn \
              rpcd-mod-iwinfo rpcd-mod-rpcsys rpcd-mod-rrdns ucode-mod-uclient libiwinfo20230701 libiwinfo-data \
              block-mount openssh-sftp-server losetup resize2fs parted gdisk btop nano \
              luci-app-openclash luci-theme-argon luci-app-argon-config luci-i18n-argon-config-zh-cn \
              luci-theme-shadcn \
              luci-app-filemanager luci-i18n-filemanager-zh-cn luci-app-ttyd luci-i18n-ttyd-zh-cn \
              luci-app-upnp luci-i18n-upnp-zh-cn \
              luci-app-wol etherwake luci-i18n-wol-zh-cn \
              luci-app-watchcat luci-i18n-watchcat-zh-cn \
              luci-app-sqm luci-i18n-sqm-zh-cn \
              luci-app-nlbwmon luci-i18n-nlbwmon-zh-cn \
              luci-app-vnstat2 luci-i18n-vnstat2-zh-cn \
              luci-proto-wireguard wireguard-tools kmod-wireguard \
              dnsmasq-full luci-compat bash curl ca-bundle ip-full ruby ruby-yaml \
              qemu-ga \
              kmod-tun kmod-inet-diag kmod-nft-tproxy unzip" \
            FILES="$GITHUB_WORKSPACE/files"
        working-directory: imagebuilder

      - name: List generated artifacts
        run: ls -lh bin/targets/x86/64/
        working-directory: imagebuilder

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ env.VERSION }}-x86-64-generic
          path: imagebuilder/bin/targets/x86/64/*
          if-no-files-found: error
